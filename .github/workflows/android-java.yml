name: TestMessagingApp Android - TestMessagingApp

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build to produce
        required: true
        default: all
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'debug' }}
        run: gradle assembleDebug --no-daemon

      - name: Build release APK and AAB
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Prepare release keystore
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' }}
        working-directory: .
        env:
          MACORAONE_KEYSTORE_B64: ${{ secrets.MACORAONE_KEYSTORE_B64 }}
          MACORAONE_STORE_PASSWORD: ${{ secrets.MACORAONE_STORE_PASSWORD }}
          MACORAONE_KEY_ALIAS: ${{ secrets.MACORAONE_KEY_ALIAS }}
          MACORAONE_KEY_PASSWORD: ${{ secrets.MACORAONE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$MACORAONE_KEYSTORE_B64" ] && [ -n "$MACORAONE_STORE_PASSWORD" ] && [ -n "$MACORAONE_KEY_ALIAS" ] && [ -n "$MACORAONE_KEY_PASSWORD" ]; then
            echo "$MACORAONE_KEYSTORE_B64" | base64 --decode > TestMessagingApp/macoraone-release.keystore
            echo "Using the configured MacoraOne release keystore."
          else
            echo "No persistent MacoraOne signing secret was configured; creating a build-local release keystore."
            keytool -genkeypair -v               -keystore TestMessagingApp/macoraone-release.keystore               -alias macoraone               -keyalg RSA -keysize 4096 -validity 10000               -storepass macoraone-build               -keypass macoraone-build               -dname "CN=MacoraOne, O=MacoraOne"
            MACORAONE_STORE_PASSWORD=macoraone-build
            MACORAONE_KEY_ALIAS=macoraone
            MACORAONE_KEY_PASSWORD=macoraone-build
          fi
          printf '%s' "$MACORAONE_STORE_PASSWORD" > /tmp/macoraone-store-password
          printf '%s' "$MACORAONE_KEY_ALIAS" > /tmp/macoraone-key-alias
          printf '%s' "$MACORAONE_KEY_PASSWORD" > /tmp/macoraone-key-password

      - name: Sign release APK
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' }}
        working-directory: .
        run: |
          set -e
          store_password="$(cat /tmp/macoraone-store-password)"
          key_alias="$(cat /tmp/macoraone-key-alias)"
          key_password="$(cat /tmp/macoraone-key-password)"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/app-release.apk"
          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$zipalign" -f 4 "$unsigned" "$signed"
          "$apksigner" sign --ks TestMessagingApp/macoraone-release.keystore             --ks-pass "pass:$store_password"             --ks-key-alias "$key_alias"             --key-pass "pass:$key_password" "$signed"
          "$apksigner" verify --verbose "$signed"

      - name: Sign release AAB
        if: ${{ inputs.build_type == 'all' || inputs.build_type == 'release' }}
        working-directory: .
        run: |
          set -e
          store_password="$(cat /tmp/macoraone-store-password)"
          key_alias="$(cat /tmp/macoraone-key-alias)"
          key_password="$(cat /tmp/macoraone-key-password)"
          aab="app/build/outputs/bundle/release/app-release.aab"
          jarsigner -keystore TestMessagingApp/macoraone-release.keystore             -storepass "$store_password" -keypass "$key_password"             "$aab" "$key_alias"
          jarsigner -verify "$aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macoraone-java-android
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
